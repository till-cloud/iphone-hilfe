  </linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0A2A70" flood-opacity="0.35"/>
  </filter>
  <filter id="shs" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0A2A70" flood-opacity="0.35"/>
  </filter>
  <pattern id="qs" width="58" height="58" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
        <text x="9" y="27" font-family="Inter" font-weight="800" font-size="24" fill="#fff" fill-opacity="0.28">?</text>
    <text x="38" y="55" font-family="Inter" font-weight="800" font-size="20" fill="#fff" fill-opacity="0.28">?</text>
  </pattern>
  <linearGradient id="qfill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFB340"/><stop offset="1" stop-color="#FF7A1A"/>
  </linearGradient>
  <mask id="qm" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <path d="M 425 405 C 425 305, 605 295, 607 398 C 609 478, 512 490, 512 575 L 512 610" stroke="#fff" stroke-width="108" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </mask>
  <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<rect width="1024" height="1024" fill="url(#glow)"/>
<g transform="translate(512 512) scale(1.2) translate(-512 -556)">

